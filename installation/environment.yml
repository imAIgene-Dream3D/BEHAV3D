# =============================================================================
# BEHAV3D Environment - Cross-Platform (Windows, macOS, Linux)
# =============================================================================
# 
# This is the BASE environment. PyTorch/Cellpose with CUDA support should be
# installed separately using the install script (install_behav3d.py)
#
# Manual installation:
#   conda env create -f environment.yml
#   conda activate behav3d
#   # Then run: python install_behav3d.py --pytorch-only
#
# =============================================================================

name: behav3d
channels:
  - conda-forge
  - defaults

dependencies:
  # -------------------------------------------------------------------------
  # Python
  # -------------------------------------------------------------------------
  - python=3.12

  # -------------------------------------------------------------------------
  # Core Scientific Computing
  # -------------------------------------------------------------------------
  - numpy>=2.0
  - pandas>=2.0
  - scipy>=1.14
  - dask-core>=2024.0
  - threadpoolctl

  # -------------------------------------------------------------------------
  # Visualization
  # -------------------------------------------------------------------------
  - matplotlib>=3.9
  - seaborn>=0.13
  - plotly>=5.0

  # -------------------------------------------------------------------------
  # Image Processing & File I/O
  # -------------------------------------------------------------------------
  - scikit-image>=0.24,<0.26   # 0.26.0 conda-forge build has ClobberError bugs
  - tifffile>=2024.0
  - imageio>=2.30
  - pillow>=10.0
  - aicspylibczi>=3.1
  - zarr>=2.16
  - h5py>=3.10
  - readlif>=0.6.6

  # -------------------------------------------------------------------------
  # Tracking
  # -------------------------------------------------------------------------
  - laptrack>=0.17
  - trackpy>=0.6

  # -------------------------------------------------------------------------
  # Machine Learning & Clustering
  # -------------------------------------------------------------------------
  - scikit-learn>=1.5
  - umap-learn>=0.5
  - hmmlearn>=0.3
  - dtaidistance>=2.3
  - pyopencl>=2026.1    # OpenCL backend for APOC GPU classifier

  # -------------------------------------------------------------------------
  # Graph Analysis & Single-Cell
  # -------------------------------------------------------------------------
  - igraph>=0.11
  - leidenalg>=0.10
  - scanpy>=1.10

  # -------------------------------------------------------------------------
  # GUI & Visualization Tools
  # -------------------------------------------------------------------------
  - napari==0.5.6
  - napari-console>=0.1
  - napari-svg>=0.2
  - magicgui>=0.8
  - qtpy>=2.4
  - pyqt>=5.15
  - ipywidgets>=8.1
  - ipyfilechooser>=0.6
  - traitlets>=5.14
  - pyopengl>=3.1
  - vispy>=0.14

  # -------------------------------------------------------------------------
  # Jupyter / IPython
  # -------------------------------------------------------------------------
  - ipython>=8.0
  - ipykernel>=6.0
  - jupyter >=1.0
  - jupyterlab>=3.0
  - jupyter_client>=8.0
  - jupyterlab_widgets>=3.0

  # -------------------------------------------------------------------------
  # Utilities
  # -------------------------------------------------------------------------
  - tqdm>=4.60
  - pyyaml>=6.0
  - joblib>=1.3
  - psutil>=5.9
  - networkx>=3.0
  - numba>=0.58
  - numcodecs>=0.12

  # -------------------------------------------------------------------------
  # Build Tools
  # -------------------------------------------------------------------------
  - pip>=24.0
  - setuptools>=70.0
  - wheel>=0.40

  # -------------------------------------------------------------------------
  # Pip-only packages (not available on conda-forge)
  # -------------------------------------------------------------------------
  - pip:
    - btrack>=0.6
    - kaleido>=1.2
    - pypdf>=6.7
    - imageio-ffmpeg>=0.5.1
    - torchsummary>=1.5.1
    - apoc>=0.12  # GPU-accelerated pixel classifier (optional, requires OpenCL)
    # PyTorch and Cellpose installed separately via install script
    # to handle CUDA detection properly
    # cellpose==3.1.1.2  # Installed by install_behav3d.py with proper GPU support
